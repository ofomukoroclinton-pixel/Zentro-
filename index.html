<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zentro</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#0f1115;color:#e6e8eb}.top{background:#1a1d26;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;position:sticky;top:0;z-index:99;border-bottom:1px solid #2a2e3a}.logo{font-weight:900;font-size:22px;color:#6c7bff}.feed{max-width:500px;margin:0 auto;padding-bottom:80px}.create-post{background:#1e222e;margin:8px;border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center}.avatar{width:40px;height:40px;border-radius:50%;background:#6c7bff;display:flex;align-items:center;justify-content:center;font-weight:700}.create-post input{flex:1;background:#2a2e3a;border:0;border-radius:20px;padding:10px 14px;color:#fff;outline:none}.post{background:#1e222e;margin:8px;border-radius:12px;overflow:hidden;border:1px solid #2a2e3a}.post-head{display:flex;gap:10px;padding:12px;align-items:center}.post-text{padding:0 12px 10px;font-size:14px;line-height:1.4}.post-img{width:100%;max-height:420px;object-fit:cover}.post-actions{display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #2a2e3a}.post-actions div{padding:6px 12px;font-size:13px;color:#9aa0b0}.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:62px;background:#1a1d26;border-top:1px solid #2a2e3a;display:flex;justify-content:space-around;align-items:center}.bottom-nav div{text-align:center;color:#9aa0b0}.bottom-nav div.active{color:#6c7bff}.btn{width:100%;background:#6c7bff;border:0;color:#fff;padding:14px;border-radius:12px;font-weight:700;margin-top:12px}.card{background:#1e222e;border-radius:16px;padding:18px;margin:12px;border:1px solid #2a2e3a}input[type=text]{width:100%;background:#2a2e3a;border:1px solid #343a4a;color:#fff;padding:12px;border-radius:10px;margin:8px 0}</style></head><body><div class="top"><div class="logo">ZENTRO.app</div></div><div class="feed"><div id="auth" class="card" style="margin-top:20px"><h2>Welcome to Zentro</h2><p style="color:#9aa0b0;font-size:13px;margin:8px 0">Facebook-like experience</p><input type="text" id="uname" placeholder="Your name e.g Clinton"><button class="btn" onclick="enter()">Enter Zentro →</button></div><div id="main" style="display:none"><div class="create-post"><div class="avatar" id="myAv">C</div><input id="postInput" placeholder="What's on your mind? Press Enter to post"></div><div id="posts"></div></div></div><div class="bottom-nav" id="bnav" style="display:none"><div class="active"><i class="fa fa-house"></i><br><span style="font-size:10px">Home</span></div><div><i class="fa fa-user-group"></i><br><span style="font-size:10px">Friends</span></div><div><i class="fa fa-circle-play"></i><br><span style="font-size:10px">Watch</span></div></div><script>let myName=localStorage.getItem('zentro_name')||'';let postsData=JSON.parse(localStorage.getItem('zentro_posts')||'[]');if(postsData.length===0){postsData=[{name:'Zentro Team',time:'2h',text:'🔥 Welcome to Zentro! LIVE on GitHub Pages! Post anything! 🚀',img:'https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?w=800'},{name:'Clinton',time:'now',text:'Port Harcourt to the world! Zentro is live!',img:''}];}function enter(){const n=document.getElementById('uname').value.trim();if(!n){alert('Enter name');return}myName=n;localStorage.setItem('zentro_name',myName);init();}function init(){if(!myName)return;document.getElementById('auth').style.display='none';document.getElementById('main').style.display='block';document.getElementById('bnav').style.display='flex';document.getElementById('myAv').innerHTML=myName[0].toUpperCase();renderPosts();}function renderPosts(){const c=document.getElementById('posts');c.innerHTML=postsData.map(p=>`<div class="post"><div class="post-head"><div class="avatar">${p.name[0].toUpperCase()}</div><div><b style="font-size:14px">${p.name}</b><br><small style="color:#9aa0b0;font-size:11px">${p.time}</small></div></div>${p.text?`<div class="post-text">${p.text}</div>`:''}${p.img?`<img class="post-img" src="${p.img}">`:''}<div class="post-actions"><div>👍 Like</div><div>💬 Comment</div><div>↗ Share</div></div></div>`).join('');}document.getElementById('postInput').addEventListener('keydown',e=>{if(e.key==='Enter'){const t=e.target.value.trim();if(!t)return;postsData.unshift({name:myName,time:'now',text:t,img:''});localStorage.setItem('zentro_posts',JSON.stringify(postsData));e.target.value='';renderPosts();}});if(myName)init();</script></body></html>
