<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ZENTRO - Onitsha Social</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,Arial}body{background:#f0f2f5}.fb-header{background:#fff;box-shadow:0 1px 3px #0002;padding:12px 16px;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center}.logo{color:#0866ff;font-weight:800;font-size:28px}.topnav{display:none;gap:8px}.btn{background:#e4e6eb;border:none;padding:8px 14px;border-radius:20px;font-weight:600}.btn.active{background:#0866ff;color:#fff}.login-wrap{min-height:90vh;display:flex;align-items:center;justify-content:center;padding:16px}.card{background:#fff;border-radius:8px;box-shadow:0 2px 10px #0002;padding:20px;width:100%;max-width:400px}.card h2{color:#0866ff;font-size:26px;font-weight:800}.inp{width:100%;border:1px solid #dddfe2;border-radius:6px;padding:14px;margin:10px 0;font-size:16px}.btn-blue{width:100%;background:#0866ff;color:#fff;border:none;padding:14px;border-radius:6px;font-weight:700;font-size:18px;margin:8px 0}.btn-wa{width:100%;background:#25D366;color:#fff;border:none;padding:12px;border-radius:6px;font-weight:700;font-size:16px}.main{max-width:680px;margin:0 auto;display:none}.create{background:#fff;border-radius:8px;padding:12px;margin:12px;box-shadow:0 1px 2px #0002}.post{background:#fff;border-radius:8px;padding:12px;margin:12px;box-shadow:0 1px 2px #0002}.avatar{width:40px;height:40px;background:#0866ff;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700}.post-text{margin:8px 0;font-size:15px;white-space:pre-wrap}.act{display:flex;border-top:1px solid #e4e6eb;margin-top:8px}.act button{flex:1;background:none;border:none;padding:10px;color:#65676b;font-weight:600}.liked{color:#0866ff!important}.hidden{display:none}</style></head><body><div class="fb-header"><div class="logo">zentro</div><div class="topnav" id="topNav"><button class="btn active">Home</button><button class="btn" onclick="location.reload()">Logout</button></div></div><div class="login-wrap" id="login"><div class="card"><h2>Log in to Zentro</h2><p style="color:#606770;margin:6px 0">Facebook style + WhatsApp login - Onitsha built</p><input id="n" class="inp" placeholder="Your full name"><input id="p" class="inp" placeholder="WhatsApp number e.g 080..."><button class="btn-blue" onclick="go()">Log In</button><div style="text-align:center;color:#8a8d91;margin:12px">OR</div><button class="btn-wa" onclick="go()">💬 Continue with WhatsApp</button><p style="font-size:11px;color:#8a8d91;text-align:center;margin-top:12px">Built in Onitsha 🇳🇬 Facebook Blue Theme</p></div></div><div class="main" id="app"><div class="create"><div style="display:flex;gap:8px;align-items:center"><div class="avatar" id="av">C</div><div style="flex:1;background:#f0f2f5;border-radius:20px;padding:10px;color:#65676b" onclick="document.getElementById('area').classList.remove('hidden')">What's on your mind, <span id="nm">Clinton</span>?</div></div><div id="area" class="hidden"><textarea id="t" class="inp" style="height:80px" placeholder="What's happening in Onitsha?"></textarea><button class="btn-blue" onclick="post()">Post to Zentro</button></div></div><div id="feed"></div></div><script>
let user=localStorage.getItem('zn')||'';let posts=JSON.parse(localStorage.getItem('zp')||'[]');if(!posts.length)posts=[{id:1,u:'Zentro Official',c:'Onitsha',x:'Welcome to ZENTRO v3! Facebook Blue + WhatsApp Login LIVE! 🎉🔵💚',l:142,lk:false,cm:[{u:'Clinton',x:'First!'}],tm:'2h'},{id:2,u:'Emeka Stores',c:'Main Market',x:'Original Sneakers for sale - WhatsApp me! ₦12,500',l:22,lk:false,cm:[],tm:'4h'}];
function save(){localStorage.setItem('zp',JSON.stringify(posts))}
function go(){let name=document.getElementById('n').value.trim();if(!name)return alert('Enter name');localStorage.setItem('zn',name);user=name;init()}
function init(){if(!user)return;document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';document.getElementById('topNav').style.display='flex';document.getElementById('nm').innerText=user;document.getElementById('av').innerText=user[0].toUpperCase();render()}
function post(){let txt=document.getElementById('t').value.trim();if(!txt)return;posts.unshift({id:Date.now(),u:user,c:'Onitsha',x:txt,l:0,lk:false,cm:[],tm:'Just now'});save();document.getElementById('t').value='';document.getElementById('area').classList.add('hidden');render()}
function like(id){let p=posts.find(a=>a.id==id);if(p.lk){p.l--;p.lk=false}else{p.l++;p.lk=true}save();render()}
function comment(id){let i=document.getElementById('i'+id);let txt=i.value.trim();if(!txt)return;posts.find(a=>a.id==id).cm.push({u:user,x:txt});save();render()}
function render(){let h='';posts.forEach(p=>{h+=`<div class="post"><div style="display:flex;gap:8px;align-items:center"><div class="avatar">${p.u[0]}</div><div><b>${p.u}</b> <span style="font-size:11px;background:#e7f3ff;color:#0866ff;padding:2px 6px;border-radius:4px">${p.c}</span><br><span style="font-size:12px;color:#65676b">${p.tm}</span></div></div><div class="post-text">${p.x}</div><div class="act"><button class="${p.lk?'liked':''}" onclick="like(${p.id})">👍 Like ${p.l?`(${p.l})`:''}</button><button>💬 ${p.cm.length?`(${p.cm.length})`:''} Comment</button><button>↗️ Share</button></div>${p.cm.map(c=>`<div style="margin-top:6px;background:#f0f2f5;border-radius:12px;padding:6px 10px;display:inline-block"><b style="font-size:13px">${c.u}</b> <span style="font-size:13px">${c.x}</span></div>`).join('')}<div style="display:flex;gap:6px;margin-top:8px"><input id="i${p.id}" placeholder="Write comment..." style="flex:1;background:#f0f2f5;border:none;border-radius:20px;padding:8px 12px"><button onclick="comment(${p.id})" style="background:#0866ff;color:#fff;border:none;border-radius:50%;width:32px;height:32px">➤</button></div></div>`});document.getElementById('feed').innerHTML=h}
if(user)init();
</script></body></html>
