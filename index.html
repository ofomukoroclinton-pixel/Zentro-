<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zentro</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}body{background:linear-gradient(135deg,#ff2a6d,#ff7a18);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.card{background:#fff;width:360px;border-radius:20px;padding:20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2)}input,select{width:100%;padding:12px;margin-top:10px;border-radius:10px;border:1px solid #ddd}button{width:100%;padding:13px;margin-top:12px;border:none;border-radius:30px;background:linear-gradient(90deg,#ff2a6d,#ff7a18);color:#fff;font-weight:700}.hide{display:none}.code{display:flex;gap:6px;justify-content:center;margin:12px 0}.code input{width:40px;height:44px;text-align:center;font-size:18px;font-weight:700}#ok{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px}.okb{background:#fff;padding:20px;border-radius:16px;width:300px;text-align:center}</style></head><body>
<div class="card" id="main">
<div id="p1"><h2>Find Love in<br><span style="color:#ff2a6d">Onitsha & Beyond</span></h2><input id="n" placeholder="Your name"><select id="g"><option value="">I am...</option><option>Male</option><option>Female</option></select><input id="a" type="number" placeholder="Age"><input id="cy" value="Onitsha"><input id="e" placeholder="Email"><input id="pw" type="password" placeholder="Password"><button onclick="go()">Confirm / Continue</button><p style="font-size:12px;margin-top:8px">Have account? <b style="color:#ff2a6d" onclick="s2()">Log In</b></p></div>
<div id="p2" class="hide"><h2>Welcome Back</h2><input id="le" placeholder="Email"><input id="lp" type="password" placeholder="Password"><button onclick="login()">Log In</button><p style="font-size:12px;margin-top:8px" onclick="s1()"><b style="color:#ff2a6d">Sign Up</b></p></div>
<div id="p3" class="hide"><h2>Verify Email</h2><p style="font-size:12px;margin:8px 0">Code to <b id="ce"></b><br>Demo: <b id="dc" style="color:#ff2a6d;font-size:16px"></b></p><div class="code"><input id="c1" maxlength="1" oninput="if(this.value)c2.focus()"><input id="c2" maxlength="1" oninput="if(this.value)c3.focus()"><input id="c3" maxlength="1" oninput="if(this.value)c4.focus()"><input id="c4" maxlength="1" oninput="if(this.value)c5.focus()"><input id="c5" maxlength="1" oninput="if(this.value)c6.focus()"><input id="c6" maxlength="1"></div><div id="tm" style="color:#ff2a6d;font-size:12px;font-weight:700">05:00</div><button onclick="okc()">Confirm Code</button><button onclick="resend()" style="background:#eee;color:#333">Resend</button></div>
</div>
<div id="ok" class="hide"><div class="okb"><div style="font-size:40px">🎉</div><h2 id="ot" style="color:#ff2a6d"></h2><p id="om"></p><button onclick="goApp()">Continue 💘</button></div></div>
<script>
let users=JSON.parse(localStorage.getItem('users')||'[]'),cur=JSON.parse(localStorage.getItem('cur')||'null'),pend=null,code=null,exp=0,t=null;
function s1(){p1.classList.remove('hide');p2.classList.add('hide');p3.classList.add('hide');}
function s2(){p1.classList.add('hide');p2.classList.remove('hide');p3.classList.add('hide');}
function go(){let name=n.value.trim(),gen=g.value,age=a.value,city=cy.value,email=e.value.trim().toLowerCase(),pass=pw.value;if(!name||!gen||!age||!email||!pass){alert('Fill all fields abeg');return}if(users.find(u=>u.email==email)){alert('You already get account, log in');s2();return}pend={name,gender:gen,age,city,email,password:pass};code=''+Math.floor(100000+Math.random()*900000);exp=Date.now()+300000;ce.textContent=email;dc.textContent=code;p1.classList.add('hide');p3.classList.remove('hide');for(let i=1;i<=6;i++)document.getElementById('c'+i).value='';c1.focus();clearInterval(t);t=setInterval(()=>{let d=exp-Date.now();if(d<=0){tm.textContent='Expired!';clearInterval(t);return}let m=Math.floor(d/60000),s=Math.floor(d%60000/1000);tm.textContent='0'+m+':'+(s<10?'0':'')+s;},1000);}
function resend(){code=''+Math.floor(100000+Math.random()*900000);exp=Date.now()+300000;dc.textContent=code;alert('New code: '+code);}
function okc(){let v='';for(let i=1;i<=6;i++)v+=document.getElementById('c'+i).value;if(v.length!=6){alert('Enter 6 digits');return}if(Date.now()>exp){alert('Expired');return}if(v!=code){alert('Wrong! Code is '+code);return}users.push(pend);cur=pend;localStorage.setItem('users',JSON.stringify(users));localStorage.setItem('cur',JSON.stringify(cur));clearInterval(t);ot.textContent='Congratulations!';om.textContent='Welcome to Zentro app 💘';ok.classList.remove('hide');}
function login(){let email=le.value.trim().toLowerCase(),pass=lp.value;let u=users.find(x=>x.email==email&&x.password==pass);if(!u){alert('Wrong email or password');return}cur=u;localStorage.setItem('cur',JSON.stringify(cur));ot.textContent='Congratulations!';om.textContent='For your successful login, welcome to Zentro app 💘';ok.classList.remove('hide');}
function goApp(){location.href='home.html';}
if(cur){ot.textContent='Welcome back!';om.textContent='You don already login before';ok.classList.remove('hide');}
</script></body></html>
