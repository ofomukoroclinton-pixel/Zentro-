<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ZENTRO.app - Onitsha's Own Social</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}body{background:#0a0a0f;color:#fff;min-height:100vh}.header{background:#11111b;border-bottom:1px solid #232334;padding:12px 16px;position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center}.logo{font-size:22px;font-weight:800;color:#6366f1}.logo span{color:#fff}.nav{display:flex;gap:8px}.nav-btn{background:#1e1e2e;border:none;color:#a1a1b5;padding:8px 14px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer}.nav-btn.active{background:#6366f1;color:#fff}.login-wrap{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:20px}.login-card{background:#15151f;border:1px solid #232334;border-radius:20px;padding:28px;width:100%;max-width:380px}.login-card h1{font-size:26px;margin-bottom:6px}.login-card p{color:#717184;font-size:14px;margin-bottom:18px}.input{width:100%;background:#0f0f15;border:1px solid #232334;border-radius:12px;padding:14px;color:#fff;font-size:15px;outline:none;margin-bottom:12px}.btn-primary{width:100%;background:#6366f1;border:none;color:#fff;padding:14px;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer}.main{max-width:600px;margin:0 auto;padding:12px;display:none}.create-card{background:#15151f;border:1px solid #232334;border-radius:16px;padding:14px;margin-bottom:14px}.create-top{display:flex;gap:10px;align-items:center}.avatar{width:40px;height:40px;border-radius:50%;background:#6366f1;display:flex;align-items:center;justify-content:center;font-weight:800}.create-input{flex:1;background:#0f0f15;border:1px solid #232334;border-radius:24px;padding:12px 16px;color:#717184;cursor:text}.tabs{display:flex;gap:8px;margin-top:12px}.tab-btn{flex:1;background:#1e1e2e;border:none;color:#a1a1b5;padding:10px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer}.tab-btn.active{background:#232334;color:#fff}.post{background:#15151f;border:1px solid #232334;border-radius:16px;padding:14px;margin-bottom:12px}.post-head{display:flex;gap:10px;align-items:center;margin-bottom:10px}.post-info h3{font-size:14px}.post-info span{font-size:11px;color:#717184}.post-text{font-size:14px;line-height:1.5;margin-bottom:10px;white-space:pre-wrap}.post-image{width:100%;border-radius:12px;margin-bottom:10px;max-height:400px;object-fit:cover}.post-actions{display:flex;justify-content:space-between;border-top:1px solid #232334;padding-top:10px;margin-top:6px}.action{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;border:none;background:transparent;color:#717184;font-size:13px;font-weight:600;cursor:pointer;border-radius:8px}.action.liked{color:#6366f1}.market-item{background:#1e1e2e;border-radius:12px;padding:10px;display:flex;gap:10px;margin-bottom:10px}.price{color:#22c55e;font-weight:800}.badge{display:inline-block;background:#6366f1;color:#fff;font-size:10px;padding:2px 8px;border-radius:20px;margin-left:6px}.comment-box{margin-top:10px;background:#0f0f15;border-radius:12px;padding:10px}.comment{font-size:13px;margin-bottom:6px}.comment b{color:#6366f1}.c-input{display:flex;gap:8px;margin-top:8px}.c-input input{flex:1;background:#1e1e2e;border:1px solid #232334;border-radius:20px;padding:8px 12px;color:#fff;font-size:13px;outline:none}.hidden{display:none!important}</style></head><body><div class="header"><div class="logo">ZENTRO<span>.app</span></div><div class="nav" id="topNav" style="display:none"><button class="nav-btn active" onclick="switchTab('feed')">Feed</button><button class="nav-btn" onclick="switchTab('market')">Market</button><button class="nav-btn" onclick="logout()">Logout</button></div></div><div class="login-wrap" id="loginPage"><div class="login-card"><h1>Welcome to Zentro</h1><p>Onitsha's own social network</p><input id="nameInput" class="input" placeholder="Your name e.g Clinton"><input id="cityInput" class="input" placeholder="Your city e.g Onitsha"><button class="btn-primary" onclick="enterZentro()">Enter Zentro →</button><p style="margin-top:14px;font-size:11px;color:#4a4a5e;text-align:center">Built in Onitsha, for Naija 🇳🇬</p></div></div><div class="main" id="mainApp"><div class="create-card"><div class="create-top"><div class="avatar" id="myAvatar">C</div><div class="create-input" onclick="focusPost()">What's on your mind, <span id="myNameDisplay">Clinton</span>?</div></div><div id="createArea" class="hidden"><textarea id="postText" class="input" style="margin-top:12px;min-height:80px;resize:none" placeholder="Share something..."></textarea><input id="postImage" class="input" placeholder="Image URL (optional)"><div style="display:flex;gap:8px"><button class="btn-primary" style="flex:1" onclick="createPost()">Post to Zentro</button><button class="nav-btn" onclick="document.getElementById('createArea').classList.add('hidden')">Cancel</button></div></div><div class="tabs"><button class="tab-btn active" id="btn-feed" onclick="switchTab('feed')">📰 Feed</button><button class="tab-btn" id="btn-market" onclick="switchTab('market')">🛒 Market</button></div></div><div id="feedContainer"></div><div id="marketContainer" class="hidden"></div></div><script>
let currentUser=localStorage.getItem('zentro_name')||'';let posts=JSON.parse(localStorage.getItem('zentro_posts')||'[]');let marketPosts=[{user:'Emeka Stores',city:'Main Market',text:'Original Sneakers & Slides - Wholesale Price! DM',price:'₦12,500',image:'https://images.unsplash.com/photo-1549298916-b41d501d3772?w=400'},{user:'Ada Fashion',city:'Onitsha',text:'Lace Gowns, Senator Wears - New arrivals! 🔥',price:'₦18,000',image:'https://images.unsplash.com/photo-1483985988355-763728e1935b?w=400'},{user:'Chinedu Phones',city:'Onitsha',text:'UK Used iPhones - 12,13,14 Pro Max',price:'₦350k',image:'https://images.unsplash.com/photo-1592899678-36bb2c1b9b1f?w=400'}];
if(posts.length===0){posts=[{id:1,user:'Zentro Official',city:'Onitsha',text:'Welcome to ZENTRO! 🎉\nThis is Onitsha own social network. Post your hustle, your market!',image:'',likes:52,liked:false,comments:[{user:'Clinton',text:'First! Zentro to the world 🚀'}],time:'2h ago'},{id:2,user:'Kene',city:'Awka',text:'Who dey Main Market today? Need good tailor!',image:'',likes:12,liked:false,comments:[],time:'4h ago'},{id:3,user:'Blessing',city:'Asaba',text:'New shop for Onitsha Main Market! Ankara at cheap price',image:'https://images.unsplash.com/photo-1445205170230-053b83016050?w=400',likes:31,liked:false,comments:[{user:'Obi',text:'Location?'}],time:'6h ago'}];save();}
function save(){localStorage.setItem('zentro_posts',JSON.stringify(posts));}
function enterZentro(){let n=document.getElementById('nameInput').value.trim();let c=document.getElementById('cityInput').value.trim()||'Onitsha';if(!n){alert('Enter name!');return;}localStorage.setItem('zentro_name',n);localStorage.setItem('zentro_city',c);currentUser=n;initApp();}
function initApp(){if(!currentUser)return;document.getElementById('loginPage').style.display='none';document.getElementById('mainApp').style.display='block';document.getElementById('topNav').style.display='flex';document.getElementById('myNameDisplay').innerText=currentUser;document.getElementById('myAvatar').innerText=currentUser[0].toUpperCase();render();}
function logout(){localStorage.removeItem('zentro_name');location.reload();}
function focusPost(){document.getElementById('createArea').classList.remove('hidden');document.getElementById('postText').focus();}
function createPost(){let t=document.getElementById('postText').value.trim();let im=document.getElementById('postImage').value.trim();if(!t){alert('Write something!');return;}posts.unshift({id:Date.now(),user:currentUser,city:localStorage.getItem('zentro_city')||'Onitsha',text:t,image:im,likes:0,liked:false,comments:[],time:'Just now'});save();document.getElementById('postText').value='';document.getElementById('postImage').value='';document.getElementById('createArea').classList.add('hidden');render();}
function likePost(id){let p=posts.find(x=>x.id===id);if(!p)return;if(p.liked){p.likes--;p.liked=false;}else{p.likes++;p.liked=true;}save();render();}
function addComment(id){let inp=document.getElementById('c-'+id);let txt=inp.value.trim();if(!txt)return;let p=posts.find(x=>x.id===id);p.comments.push({user:currentUser,text:txt});save();render();}
function switchTab(tab){if(tab==='feed'){document.getElementById('feedContainer').classList.remove('hidden');document.getElementById('marketContainer').classList.add('hidden');document.getElementById('btn-feed')?.classList.add('active');document.getElementById('btn-market')?.classList.remove('active');}else{document.getElementById('feedContainer').classList.add('hidden');document.getElementById('marketContainer').classList.remove('hidden');document.getElementById('btn-market')?.classList.add('active');document.getElementById('btn-feed')?.classList.remove('active');renderMarket();}}
function render(){let h='';posts.forEach(p=>{h+=`<div class="post"><div class="post-head"><div class="avatar">${p.user[0].toUpperCase()}</div><div class="post-info"><h3>${p.user} <span class="badge">${p.city}</span></h3><span>${p.time}</span></div></div><div class="post-text">${esc(p.text)}</div>${p.image?`<img class="post-image" src="${p.image}" onerror="this.style.display='none'">`:''}<div class="post-actions"><button class="action ${p.liked?'liked':''}" onclick="likePost(${p.id})">❤️ ${p.likes>0?p.likes+' Likes':'Like'}</button><button class="action" onclick="document.getElementById('c-${p.id}').focus()">💬 ${p.comments.length>0?p.comments.length+' Comments':'Comment'}</button><button class="action" onclick="navigator.share?navigator.share({title:'Zentro',text:'${p.text.slice(0,30)}',url:location.href}):alert('Link copied! '+location.href)">↗️ Share</button></div>${p.comments.length>0?`<div class="comment-box">${p.comments.map(c=>`<div class="comment"><b>${c.user}:</b> ${esc(c.text)}</div>`).join('')}</div>`:''}<div class="c-input"><input id="c-${p.id}" placeholder="Write a comment..."><button class="nav-btn active" onclick="addComment(${p.id})" style="border-radius:20px">Send</button></div></div>`;});document.getElementById('feedContainer').innerHTML=h;}
function renderMarket(){let h='<div class="post"><h3>🛒 Onitsha Main Market</h3><p style="font-size:13px;color:#717184">Sell your market inside Zentro!</p></div>';marketPosts.forEach(m=>{h+=`<div class="post"><div class="post-head"><div class="avatar">${m.user[0]}</div><div class="post-info"><h3>${m.user}</h3><span>${m.city}</span></div></div><div class="post-text">${m.text}</div><img class="post-image" src="${m.image}"><div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><span class="price">${m.price}</span><button class="btn-primary" style="width:auto;padding:8px 18px;border-radius:20px" onclick="alert('WhatsApp ${m.user} - Coming soon!')">Chat Seller</button></div></div>`;});document.getElementById('marketContainer').innerHTML=h;}
function esc(t){let d=document.createElement('div');d.textContent=t;return d.innerHTML;}
if(currentUser)initApp();
</script></body></html>
