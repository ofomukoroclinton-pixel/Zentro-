<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zentro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:linear-gradient(135deg,#ff2a6d,#ff7a18);min-height:100vh;display:flex;justify-content:center;padding:16px}
.card{background:#fff;width:360px;border-radius:20px;padding:20px;margin-top:20px;text-align:center}
input,select{width:100%;padding:12px;margin-top:10px;border-radius:10px;border:1px solid #ddd}
button{width:100%;padding:13px;margin-top:12px;border:none;border-radius:30px;background:linear-gradient(90deg,#ff2a6d,#ff7a18);color:#fff;font-weight:700}
.hide{display:none}
.code{display:flex;gap:6px;justify-content:center;margin:12px 0}
.code input{width:42px;height:44px;text-align:center;font-weight:800}
#pop{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.popbox{background:#fff;padding:20px;border-radius:16px;width:300px;text-align:center}
#appDiv{width:100%;max-width:400px}
.top{background:#fff;padding:12px;display:flex;justify-content:space-between;border-radius:12px;margin-bottom:12px}
.box{background:#fff;border-radius:12px;padding:12px;margin-top:12px}
</style>
</head>
<body>
<div id="authDiv">
<div class="card" id="c1">
<h2>Find Love in <span style="color:#ff2a6d">Onitsha</span></h2>
<input id="nm" placeholder="Your name">
<select id="gd"><option value="">I am...</option><option>Male</option><option>Female</option></select>
<input id="ag" type="number" placeholder="Age">
<input id="ct" value="Onitsha">
<input id="em" placeholder="Email">
<input id="pw" type="password" placeholder="Password">
<button id="btn1">Confirm / Continue</button>
<p style="font-size:12px;margin-top:10px">Have account? <b style="color:#ff2a6d" onclick="showLogin()">Log In</b></p>
</div>
<div class="card hide" id="c2">
<h2>Welcome Back</h2>
<input id="lem" placeholder="Email">
<input id="lpw" type="password" placeholder="Password">
<button id="btn2">Log In</button>
<p style="font-size:12px;margin-top:10px" onclick="showSign()"><b style="color:#ff2a6d">Sign Up</b></p>
</div>
<div class="card hide" id="c3">
<h2>Verify</h2>
<p style="font-size:12px">Code to <b id="cem"></b><br>Demo: <b id="dcode" style="color:#ff2a6d;font-size:18px"></b></p>
<div class="code">
<input id="o1" maxlength="1"><input id="o2" maxlength="1"><input id="o3" maxlength="1"><input id="o4" maxlength="1"><input id="o5" maxlength="1"><input id="o6" maxlength="1">
</div>
<div id="tme" style="color:#ff2a6d;font-size:12px">05:00</div>
<button id="btn3">Confirm Code</button>
<button id="btn4" style="background:#eee;color:#333">Resend</button>
</div>
</div>
<div id="pop" class="hide"><div class="popbox"><div style="font-size:40px">🎉</div><h2 style="color:#ff2a6d">Congratulations!</h2><p id="popMsg" style="margin:10px 0;font-size:14px"></p><button id="btn5">Continue 💘</button></div></div>
<div id="appDiv" class="hide">
<div class="top"><b style="color:#ff2a6d">zentro 💘</b><span id="avt">C</span></div>
<div class="box"><h3>💘 Discover</h3><div id="dlist"></div><p id="nobody" style="color:#888;padding:10px;text-align:center">No other users yet. Share link!</p></div>
<div class="box" style="text-align:center"><b id="pname"></b><br><span id="pmeta" style="font-size:12px;color:#777"></span><br><button onclick="localStorage.clear();location.reload()" style="background:#eee;color:#333;margin-top:10px">Log Out / Clear</button></div>
</div>
<script>
let users=[],cur=null,pend=null,code=null,exp=0,timer=null;
users=JSON.parse(localStorage.getItem('U')||'[]');
cur=JSON.parse(localStorage.getItem('C')||'null');
const $=id=>document.getElementById(id);
function showSign(){ $('c1').classList.remove('hide');$('c2').classList.add('hide');$('c3').classList.add('hide');}
function showLogin(){ $('c1').classList.add('hide');$('c2').classList.remove('hide');$('c3').classList.add('hide');}
$('btn1').onclick=()=>{
 let n=$('nm').value.trim(),g=$('gd').value,a=$('ag').value,c=$('ct').value,e=$('em').value.trim().toLowerCase(),p=$('pw').value;
 if(!n||!g||!a||!e||!p){alert('Fill all fields');return}
 if(users.find(u=>u.email==e)){alert('Account exists, login');showLogin();return}
 pend={name:n,gender:g,age:a,city:c,email:e,password:p};
 code=''+Math.floor(100000+Math.random()*900000);
 exp=Date.now()+300000;
 $('cem').textContent=e; $('dcode').textContent=code;
 $('c1').classList.add('hide');$('c3').classList.remove('hide');
 for(let i=1;i<=6;i++)$('o'+i).value='';$('o1').focus();
 clearInterval(timer);
 timer=setInterval(()=>{
  let d=exp-Date.now();
  if(d<=0){$('tme').textContent='Expired!';clearInterval(timer);return}
  let m=Math.floor(d/60000),s=Math.floor(d%60000/1000);
  $('tme').textContent='0'+m+':'+(s<10?'0':'')+s;
 },1000);
};
$('btn4').onclick=()=>{
 code=''+Math.floor(100000+Math.random()*900000);
 exp=Date.now()+300000;
 $('dcode').textContent=code;
 alert('New code: '+code);
};
$('btn3').onclick=()=>{
 let v='';for(let i=1;i<=6;i++)v+=$('o'+i).value;
 if(v.length!=6){alert('Enter 6');return}
 if(Date.now()>exp){alert('Expired');return}
 if(v!=code){alert('Wrong! Code is '+code);return}
 users.push(pend);cur=pend;
 localStorage.setItem('U',JSON.stringify(users));
 localStorage.setItem('C',JSON.stringify(cur));
 clearInterval(timer);
 $('popMsg').textContent='Welcome to Zentro app 💘 Verified!';
 $('pop').classList.remove('hide');
};
$('btn2').onclick=()=>{
 let e=$('lem').value.trim().toLowerCase(),p=$('lpw').value;
 let u=users.find(x=>x.email==e&&x.password==p);
 if(!u){alert('Wrong email/pass');return}
 cur=u;localStorage.setItem('C',JSON.stringify(cur));
 $('popMsg').textContent='For your successful login, welcome to Zentro app 💘';
 $('pop').classList.remove('hide');
};
$('btn5').onclick=()=>{
 $('pop').classList.add('hide');
 check();
};
function check(){
 if(cur){
  $('authDiv').classList.add('hide');
  $('appDiv').classList.remove('hide');
  $('avt').textContent=cur.name[0].toUpperCase();
  $('pname').textContent=cur.name;
  $('pmeta').textContent=cur.age+' • '+cur.city;
  let others=users.filter(u=>u.email!=cur.email);
  if(others.length==0){$('nobody').classList.remove('hide');$('dlist').innerHTML='';}
  else{$('nobody').classList.add('hide');$('dlist').innerHTML=others.map(u=>'<div style="border:1px solid #ffe0e8;padding:8px;border-radius:8px;margin-top:6px"><b>'+u.name+'</b> '+u.age+' • '+u.city+'</div>').join('');}
 }else{
  $('authDiv').classList.remove('hide');
  $('appDiv').classList.add('hide');
  showSign();
 }
}
for(let i=1;i<=5;i++){
 $('o'+i).addEventListener('input',()=>{if($('o'+i).value) $('o'+(i+1)).focus();});
}
check();
</script>
</body>
  </html>
