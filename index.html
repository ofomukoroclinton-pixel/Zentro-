<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZENTRO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f0f2f5}
.header{background:#fff;padding:12px;display:flex;justify-content:space-between;box-shadow:0 1px 3px #0002;position:sticky;top:0}
.logo{color:#0866ff;font-weight:900;font-size:28px}
.login-wrap{min-height:90vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#fff;border-radius:8px;padding:20px;width:100%;max-width:400px;box-shadow:0 2px 10px #0002}
.card h2{color:#0866ff;font-size:26px}
.inp{width:100%;padding:14px;border:1px solid #ddd;border-radius:6px;margin:8px 0;font-size:16px}
.btn-blue{width:100%;background:#0866ff;color:#fff;border:none;padding:14px;border-radius:6px;font-weight:700;font-size:18px}
.btn-wa{width:100%;background:#25D366;color:#fff;border:none;padding:12px;border-radius:6px;font-weight:700;margin-top:8px}
.main{max-width:680px;margin:0 auto;display:none}
.post{background:#fff;border-radius:8px;padding:12px;margin:12px;box-shadow:0 1px 2px #0002}
.avatar{width:40px;height:40px;background:#0866ff;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}
</style>
</head>
<body>
<div class="header"><div class="logo">zentro</div></div>
<div class="login-wrap" id="login"><div class="card">
<h2>Log in to Zentro</h2>
<p>Facebook Blue + WhatsApp Login</p>
<input id="n" class="inp" placeholder="Your name">
<input id="p" class="inp" placeholder="WhatsApp number">
<button class="btn-blue" onclick="go()">Log In</button>
<button class="btn-wa" onclick="go()">💬 Continue with WhatsApp</button>
</div></div>
<div class="main" id="app">
<div class="post"><div style="display:flex;gap:8px"><div class="avatar" id="av">C</div><input id="t" class="inp" placeholder="What's on your mind?" style="flex:1"><button class="btn-blue" style="width:auto;padding:10px 16px" onclick="post()">Post</button></div></div>
<div id="feed"></div>
</div>
<script>
let user=localStorage.getItem('zn')||'';
let posts=JSON.parse(localStorage.getItem('zp')||'[]');
if(!posts.length)posts=[{u:'Zentro Official',c:'Onitsha',x:'Welcome to ZENTRO v3 Blue! 🔵 Facebook + WhatsApp LIVE! 🎉',l:142,lk:false,cm:[]}];
function save(){localStorage.setItem('zp',JSON.stringify(posts))}
function go(){let name=document.getElementById('n').value.trim();if(!name)return alert('Enter name');localStorage.setItem('zn',name);user=name;init()}
function init(){if(!user)return;document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';render()}
function post(){let txt=document.getElementById('t').value.trim();if(!txt)return;posts.unshift({u:user,c:'Onitsha',x:txt,l:0,lk:false,cm:[]});save();document.getElementById('t').value='';render()}
function render(){let h='';posts.forEach((p,i)=>{h+=`<div class="post"><b>${p.u}</b> <span style="background:#e7f3ff;color:#0866ff;font-size:11px;padding:2px 6px;border-radius:4px">${p.c}</span><div style="margin:8px 0">${p.x}</div><button onclick="let q=posts[${i}];if(q.lk){q.l--;q.lk=false}else{q.l++;q.lk=true}save();render()" style="background:none;border:none;color:${p.lk?'#0866ff':'#65676b'};font-weight:600">👍 Like ${p.l||''}</button></div>`});document.getElementById('feed').innerHTML=h}
if(user)init();
</script>
</body>
  </html>
